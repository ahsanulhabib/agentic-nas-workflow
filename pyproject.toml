[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-nas-workflow"
version = "0.4.0"
description = "OKF + Apache Jena KG + GraphRAG workflow for a TrueNAS/Nextcloud archive"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=16,<24",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "rdflib>=7.0,<8",
    "networkx>=3.3,<4",
    "plotly>=5.22,<7",
    "streamlit>=1.36,<2",
    "streamlit-agraph>=0.0.45,<1",
    "prefect>=3.0,<4",
    "langgraph>=0.2,<2",
    "google-genai>=1.0,<2",
    "openai>=1.40,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"